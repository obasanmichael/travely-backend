# Fly.io config for the API. Secrets (DATABASE_URL, GOOGLE_APPLICATION_CREDENTIALS_JSON,
# FIREBASE_PROJECT_ID, SENTRY_DSN) are set with `fly secrets set`, never in this file.
app = "travely-api"
# London: same city as the Neon database.
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"
  build-target = "runtime"

[env]
  ENV = "production"
  AUTH_DISABLED = "false"
  DOCS_ENABLED = "false"
  ALLOWED_ORIGINS = "https://travely-app-two.vercel.app"
  # Public project id, not a secret. With no service-account key, token revocation checks are off.
  FIREBASE_PROJECT_ID = "travely-app-6aa48"
  AUTH_CHECK_REVOKED = "false"

[deploy]
  # Runs in a temporary machine before the new version takes traffic; a failed migration stops the deploy.
  release_command = "alembic upgrade head"
  strategy = "rolling"

[http_service]
  internal_port = 8000
  force_https = true
  # One machine always on: the first request after a cold start would wait for the engine snapshot to load.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/readyz"
    interval = "15s"
    timeout = "5s"
    # The catalogue snapshot loads at startup, so give it time before the first check counts.
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
