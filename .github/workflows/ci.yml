name: CI

on:
  pull_request:
  push:
    branches: [main, revamp]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: travely
          POSTGRES_PASSWORD: travely
          POSTGRES_DB: travely_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travely -d travely_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # postgis/postgis also installs the tiger geocoder and topology extensions.
      # Neon and local dev have plain PostGIS only, so match that.
      - name: Match production extensions
        run: >-
          psql -h localhost -U travely -d travely_test -c
          "DROP EXTENSION IF EXISTS postgis_tiger_geocoder CASCADE;
          DROP EXTENSION IF EXISTS postgis_topology CASCADE;
          DROP EXTENSION IF EXISTS address_standardizer_data_us CASCADE;
          DROP EXTENSION IF EXISTS address_standardizer CASCADE;
          DROP EXTENSION IF EXISTS fuzzystrmatch CASCADE;
          DROP SCHEMA IF EXISTS tiger CASCADE; DROP SCHEMA IF EXISTS tiger_data CASCADE;
          DROP SCHEMA IF EXISTS topology CASCADE;"
        env:
          PGPASSWORD: travely

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest -q
        env:
          AUTH_DISABLED: "true"
          ENV: development
          TEST_DATABASE_URL: postgresql+asyncpg://travely:travely@localhost:5432/travely_test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build --target runtime -t travely-api:${{ github.sha }} .

  deploy:
    # Only after tests pass on main, and only once the repo variable DEPLOY_ENABLED is "true"
    # (set it after the Fly app and FLY_API_TOKEN exist). The "production" environment can require a reviewer.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [test, docker]
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@v1

      # One machine: the rate limiter counts per process until Redis is added.
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Check the new version is ready
        run: |
          for i in $(seq 1 12); do
            if curl -fsS https://travely-api.fly.dev/readyz; then exit 0; fi
            sleep 10
          done
          echo "readyz never succeeded" && exit 1
