services:
  - type: web
    name: travely-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: AUTH_DISABLED
        value: "false"
      - key: DOCS_ENABLED
        value: "false"
      - key: PYTHON_VERSION
        value: 3.11.11
